name: Mirror to Gitee & AtomGit

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee (NEC-Pi5)
        run: |
          git push "https://darrenpig:${{ secrets.GITEE_TOKEN }}@gitee.com/darrenpig/NEC-Pi5.git" \
            --all --tags --force 2>&1 | grep -v "remote:" || true

      - name: Push to AtomGit (NEC-Pi5)
        run: |
          git push "https://Darrenpig:${{ secrets.ATOMGIT_TOKEN }}@atomgit.com/Darrenpig/NEC-Pi5.git" \
            --all --tags --force 2>&1 | grep -v "remote:" || true
